pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    // Groovy controller (stonecutter.gradle) and shared build script (build.gradle).
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // One subproject per Minecraft version: versions/<mc>/ (holds gradle.properties for that version).
        versions '1.21.11', '26.2', '26.3'
        // The version whose code is checked in to src/ (newest).
        vcsVersion = '26.2'
    }
}

rootProject.name = 'venti'
