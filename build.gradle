// Shared build script: Stonecutter evaluates it once per Minecraft version (versions/<mc>/),
// reading that version's versions/<mc>/gradle.properties.
// versions/<mc>/gradle.properties picks the Loom plugin: 'net.fabricmc.fabric-loom-remap' for obfuscated
// versions (1.21.11, Mojang mappings) and 'net.fabricmc.fabric-loom' for unobfuscated ones (26.x).
apply plugin: project.loom_plugin
def remapped = project.loom_plugin == 'net.fabricmc.fabric-loom-remap'
def javaVersion = project.java_version as int

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven {
        name = "Meteor Releases"
        url = "https://maven.meteordev.org/releases"
        content { includeGroup "meteordevelopment" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (remapped) {
        mappings loom.officialMojangMappings()
    }
    // Mods are remapped on obfuscated versions (modImplementation) and used as-is on 26.x.
    def modImpl = remapped ? 'modImplementation' : 'implementation'
    add(modImpl, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modImpl, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
    implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") { transitive = false }
    // Discord Rich Presence IPC (Discord Presence module), bundled jar-in-jar.
    implementation "meteordevelopment:discord-ipc:1.1"
    include "meteordevelopment:discord-ipc:1.1"

    runtimeOnly "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-binding:${project.imgui_version}"
    include "io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
}

loom {
    runs {
        client {
            vmArg "-Dventi.openGui=true"
        }
    }
}

processResources {
    def props = [version: project.version, minecraft: project.mc_dep, java: javaVersion]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
    filesMatching("*.mixins.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    from(rootProject.file("LICENSE")) { rename { "LICENSE_${project.archives_base_name}" } }
}
