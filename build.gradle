// Shared build script: Stonecutter evaluates it once per Minecraft version (versions/<mc>/),
// reading that version's versions/<mc>/gradle.properties.
// versions/<mc>/gradle.properties picks the Loom plugin: 'net.fabricmc.fabric-loom-remap' for obfuscated
// versions (1.21.11, Mojang mappings) and 'net.fabricmc.fabric-loom' for unobfuscated ones (26.x).
apply plugin: project.loom_plugin
def remapped = project.loom_plugin == 'net.fabricmc.fabric-loom-remap'
def javaVersion = project.java_version as int

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

// 26.3 moved the GPU API out of com.mojang.blaze3d into com.mojang.renderpearl. src/ keeps the 26.2
// names; Stonecutter rewrites these fully qualified names when it generates the 26.3 sources.
def renderpearlMoves = [
    'GpuFormat': 'api.GpuFormat',
    'IndexType': 'api.pipeline.IndexType',
    'PrimitiveTopology': 'api.pipeline.PrimitiveTopology',
    'buffers.GpuBufferSlice': 'api.buffers.GpuBufferSlice',
    'buffers.GpuBuffer': 'api.buffers.GpuBuffer',
    'buffers.GpuFence': 'api.commands.GpuFence',
    'opengl.GlBackend': 'backend.opengl.GlBackend',
    'opengl.GlConst': 'backend.opengl.GlConst',
    'opengl.GlStateManager': 'backend.opengl.GlStateManager',
    'opengl.GlTexture': 'backend.opengl.GlTexture',
    'pipeline.BindGroupLayout': 'api.pipeline.BindGroupLayout',
    'pipeline.BlendFunction': 'api.pipeline.BlendFunction',
    'pipeline.ColorTargetState': 'api.pipeline.ColorTargetState',
    'pipeline.DepthStencilState': 'api.pipeline.DepthStencilState',
    'pipeline.RenderPipeline': 'api.pipeline.RenderPipeline',
    'platform.CompareOp': 'api.pipeline.CompareOp',
    'shaders.UniformType': 'api.pipeline.UniformType',
    'systems.CommandEncoder': 'api.commands.CommandEncoder',
    'systems.GpuDevice': 'api.device.GpuDevice',
    'systems.GpuSurface': 'api.device.GpuSurface',
    'systems.RenderPass': 'api.commands.RenderPass',
    'textures.FilterMode': 'api.textures.FilterMode',
    'textures.GpuSampler': 'api.textures.GpuSampler',
    'textures.GpuTextureView': 'api.textures.GpuTextureView',
    'textures.GpuTexture': 'api.textures.GpuTexture',
    'vertex.VertexFormat': 'api.vertex.VertexFormat',
]
def onRenderpearl = stonecutter.eval(stonecutter.current.version, '>=26.3')
renderpearlMoves.each { from, to ->
    stonecutter.replacements.string(onRenderpearl) {
        replace("com.mojang.blaze3d.${from}", "com.mojang.renderpearl.${to}")
    }
    // The same names in mixin target descriptors.
    stonecutter.replacements.string(onRenderpearl) {
        replace("com/mojang/blaze3d/${from.replace('.', '/')};", "com/mojang/renderpearl/${to.replace('.', '/')};")
    }
}
// Plain renames in 26.3: PoseStack.mulPose(Quaternionfc) became rotate(...), and the keyboard key type
// KEYSYM became KEYBOARD (its key codes are now SDL scancodes; see dev.venti.compat.Keys).
[
    'mulPose(Axis.': 'rotate(Axis.',
    'InputConstants.Type.KEYSYM': 'InputConstants.Type.KEYBOARD',
].each { from, to ->
    stonecutter.replacements.string(onRenderpearl) {
        replace(from, to)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Meteor Releases"
        url = "https://maven.meteordev.org/releases"
        content { includeGroup "meteordevelopment" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (remapped) {
        mappings loom.officialMojangMappings()
    }
    // Mods are remapped on obfuscated versions (modImplementation) and used as-is on 26.x.
    def modImpl = remapped ? 'modImplementation' : 'implementation'
    add(modImpl, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modImpl, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    implementation "io.github.spair:imgui-java-binding:${project.imgui_version}"
    implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}") { transitive = false }
    // Discord Rich Presence IPC (Discord Presence module), bundled jar-in-jar.
    implementation "meteordevelopment:discord-ipc:1.1"
    include "meteordevelopment:discord-ipc:1.1"

    runtimeOnly "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-binding:${project.imgui_version}"
    include "io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-windows:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-macos:${project.imgui_version}"
    include "io.github.spair:imgui-java-natives-linux:${project.imgui_version}"
}

loom {
    runs {
        client {
            vmArg "-Dventi.openGui=true"
        }
    }
}

processResources {
    def props = [version: project.version, minecraft: project.mc_dep, java: javaVersion]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
    filesMatching("*.mixins.json") { expand props }
}

// 26.3 compiles shaders with shaderc (Vulkan-style GLSL): stage inputs and outputs need explicit locations and
// includes are #include. Venti's shaders are written in 26.2's GLSL (one input and one output per stage) and are
// converted line by line when building 26.3.
if (onRenderpearl) {
    processResources {
        filesMatching('assets/venti/shaders/**') {
            filter { String line ->
                if (line.startsWith('#version ')) {
                    return line + '\n#extension GL_ARB_separate_shader_objects : require'
                }
                return line.replaceFirst(/^#moj_import /, '#include ').replaceFirst(/^(in|out) /, 'layout(location = 0) $1 ')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    from(rootProject.file("LICENSE")) { rename { "LICENSE_${project.archives_base_name}" } }
}
